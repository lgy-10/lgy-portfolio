랜드 모델.\u003c/b> 평소에는 덤덤하고 조금 소심하지만 연인 앞에서는 장난을 치고 먼저 애정을 표현한다. 일에서는 자기 의견을 말하면서도, \u003cb>연인이 실망하거나 떠날까 봐 불만을 쉽게 말하지 못한다.\u003c/b> 서로의 외도를 모른 척하며 함께 사는 부모를 보고 자라, 문제가 있어도 말하지 않으면 헤어지지 않을 수 있다고 생각한다. 도윤과 함께하는 일상과 결혼을 원하면서도, 지훈과 작업하며 느끼는 즐거움과 그에 대한 사랑을 포기하지 못한다. 두 사람을 잃지 않으려고 각자가 듣고 싶어 하는 약속을 한다. 사실을 털어놓은 뒤에도 \u003cb>자신이 속였다는 죄책감 때문에 무리한 요구를 거절하지 못한다. \u003c/b>\u003cbr>\u003cbr>\u003cb>서도윤 / 31세.\u003c/b> 성실하고 다정하지만 원칙이 확고한 브랜드 전략기획자. 정화는 첫사랑이자 결혼을 약속한 연인이며, 실패한 이야기도 편하게 털어놓을 수 있는 사람이다. 방송에서 내세운 이미지가 거짓으로 드러나면 문제가 된다는 것을 알지만, 정화의 외도를 보고도 모른 척한다. 결혼 준비를 중단하고 떠난 뒤에도 정화가 자신을 사랑한다는 사실 때문에 돌아온다. 지훈의 존재를 받아들이면서도 함께 지내다 보면 \u003cb>정화가 결국 자신만 선택할 것이라고 기대한다.\u003c/b> 결혼 준비를 끝낸 뒤에도 그 기대를 버리지 못한다.\u003cbr>\u003cbr>\u003cb>한지훈 / 28세.\u003c/b> 능청스럽고 호감을 가볍게 드러내는 프리랜서 사진작가. 작업의 완성도와 자신의 기여를 인정받는 일을 중요하게 여기며, 과거 선배에게 작업 성과를 빼앗기고 촬영에서 제외된 적이 있다. 처음에는 자신의 인물 사진을 알아봐 준 정화에게 흥미를 느껴, 개인 촬영을 제안하며 가볍게 반응을 떠본다. 그러나 함께 작업하며 의견을 주고받고 정화가 작가 교체를 막아주자, \u003cb>가볍게 시작한 마음이 진심으로 바뀐다.\u003c/b> 결혼 전까지만 만나자는 말에 관계를 끝내려 하지만, 정화가 자신을 계속 연인으로 만나겠다고 하자 돌아온다. 관계를 당장 알리지 않기로 한 약속도 잠시 기다려 달라는 뜻으로 받아들인다. 사람들 앞에서 도윤만 연인으로 소개될 때마다 \u003cb>자신은 여전히 숨겨야 할 상대라고 느낀다.\u003c/b> 정화의 동의 없이 공개하지는 않지만, 계속 비밀로 남을 생각도 없다."},{"label":"배경","html":"현대 서울의 방송·광고·SNS 업계가 배경이다. 정화와 도윤은 \u003cb>‘출연 기간 동안 서로가 유일한 연인일 것’\u003c/b>이라는 조건으로 실제 커플이 출연하는 연애 프로그램에 나가고, 지훈이 프로그램 사진 촬영을 맡는다. 정화와 지훈의 관계는 작업실에서 드러나고, 전시장에서는 누구를 정화의 연인으로 소개할지가 문제가 된다. 관계가 알려지면 출연 계약을 지키기 어려워지고, 비밀로 두면 지훈이 불만을 느낀다. 도윤은 결혼을 원하지만 정화는 지훈과도 헤어질 생각이 없다. 부모의 집에서는 외도를 덮고 결혼하라는 요구를 통해, 정화가 갈등을 숨기게 된 가정환경을 보여준다."}],"synTitle":"시놉시스","syn":[{"label":"1막","html":"거리의 사람들이 연애 프로그램에 나오는 ‘유정화’를 수군거린다. 같은 밤, 정화는 도윤과 몸을 겹친 뒤 “사랑해”라고 속삭이고, \u003cb>도윤은 잠시 놀란 얼굴로 굳었다가\u003c/b> “나도 사랑해”라고 답한다. 다음 날 아침, 정화는 함께 찍은 사진 속 도윤의 굳은 표정을 놀리며 웃는다. 그때 두 사람이 지원한 연애 프로그램의 출연이 확정되지만, 기뻐하는 정화와 달리 도윤의 얼굴은 잠깐 어두워진다. 프로필 촬영 날, 제작진은 \u003cb>‘출연 기간 동안 서로가 유일한 연인일 것’\u003c/b>이라는 출연 조건을 다시 확인시킨다. 촬영이 끝난 뒤 정화는 사진작가 지훈의 인물 사진에서 꾸미지 않은 표정이 좋았다고 말하고, 지훈은 도윤이 자리를 비운 사이 정화만 찍는 개인 작업을 가볍게 제안한다. 정화는 작업 내용을 보고 결정하겠다며 답을 미룬다. 개인 작업에서 정화는 처음으로 원하는 구도를 제안하고, 그 의견이 받아들여지자 숨이 트인다. 제작진이 업계 소문을 이유로 작가 교체를 통보하자, \u003cb>정화는 그동안의 작업물을 직접 보내 제작진이 결과물을 보고 결정하게 만든다.\u003c/b> 가볍게 던졌던 지훈의 관심은 이때부터 진심이 된다.\u003cbr>화보 작업 중 지훈이 마음을 고백하자 정화는 결혼할 사람이 있다며 거절한다. 그러나 지훈이 사적인 연락을 끊자 정화는 그와 일할 때만 마음껏 말할 수 있던 자신까지 잃을 것 같아 \u003cb>먼저 작업실을 찾아가 연애를 시작한다.\u003c/b> 그날 밤 정화는 설렘과 죄책감을 감추려 도윤에게 먼저 안기고, 지훈에게는 결혼 전까지만 만나자고 말한다. 잠시 만나다 버릴 생각이냐며 반발하던 지훈은 다시 찾아온 정화를 돌려보내지 못한다."},{"label":"2막","html":"정화를 데리러 작업실에 온 도윤은 정화와 지훈의 입맞춤을 목격하지만, 무너지는 마음을 누른 채 모른 척한다. 정화는 도윤에게 방송이 끝나면 지훈과 만날 일이 없다고 둘러댄다.\u003cbr>방송 홍보 사진을 고르는 회의에서 도윤은 정화와 지훈의 사적인 감정이 드러난 사진을 프로그램 이미지에 맞지 않는다며 빼자고 하고, 지훈은 작업의 핵심이라며 맞선다. 언쟁 끝에 도윤은 작업실에서 목격한 입맞춤을, 지훈은 결혼 전까지만 만나자던 정화의 말을 꺼낸다. 두 남자는 정화가 \u003cb>자신들을 붙잡으려고 각자 다른 약속을 했다는 것\u003c/b>을 알게 된다. 도윤이 자신을 선택하라고 요구하자, 정화는 지훈도 사랑한다고 답한다. 도윤은 결혼 준비를 멈추고 짐을 챙겨 나가며, 지훈도 남은 화보 작업만 마친 뒤 관계를 끝내자고 한다. 도윤에게서 외도 사실을 들은 정화의 부모는 남들 모르게 덮고 결혼하라고 정화를 몰아세운다. 부모에게서 자신의 모습을 본 정화는 그들 역시 서로의 외도를 덮고 살아오지 않았느냐고 되묻고 집을 나온다. 그날 밤 정화는 도윤에게 지훈과 헤어지겠다는 문자를 썼다가 지우고, 지훈에게도 도윤과 헤어지겠다고 약속하지 못한다.\u003cbr>남은 짐을 찾으러 온 도윤은 지훈을 계속 만나겠다는 정화의 답에 자리에서 일어선다. 부모처럼 덮고 사는 방식으로는 돌아가지 않기로 한 정화는 두 사람 모두와 연애하고 싶으며, 받아들일 수 없다면 \u003cb>더는 거짓말로 붙잡지 않겠다고 말한다.\u003c/b> 처음으로 아무것도 숨기지 않은 채 버림받을 수도 있는 순간이다. 도윤은 현관에서 멈춰 용서한 것은 아니라며 다시 만나보자고 한다. 배신감보다 정화를 잃는 두려움이 더 크기 때문이다. 지훈은 다시 만나는 조건으로, 방송이 끝나면 자신도 사람들 앞에서 연인으로 소개해 달라고 요구한다. 겨우 붙잡은 도윤이 다시 떠날까 두려운 정화는 \u003cb>이 조건을 도윤에게 전하지 않은 채 세 사람이 만날 자리를 마련한다. \u003c/b> 세 사람은 처음으로 마주 앉아 서로의 만남을 숨기지 않되, \u003cb>다른 사람들에게 알리는 일은 모두가 동의할 때\u003c/b> 하기로 정한다. 그 과정에서 지훈은 정화가 자신의 조건을 도윤에게 전하지 않았다는 사실을 알게 되지만, 정화는 두 사람이 헤어지자고 하지 않는다는 사실에 매달리듯 안심한다.\u003cbr>지훈과 식사하던 중 지인에게 전화가 오자 정화는 도윤과 있다고 답한다. \u003cb>합의 뒤 처음으로 지훈을 숨긴 것이다.\u003c/b> 그 말에 지훈의 얼굴이 굳는다. 서운해하는 지훈을 달래려 정화는 셋이 함께 시간을 보내자고 한다. 그날 밤 도윤이 “결국엔 나한테 돌아올 거지?”라고 묻고, 정화는 끝내 답하지 못한다. 다음 날 지훈은 사람들 앞에서도 자신을 연인으로 인정해 달라고 하지만, 도윤은 공개에 동의한 적 없다고 답한다. 정화는 지인에게 한 거짓말이 미안해 이후 지훈의 요구도 거절하지 못한다."},{"label":"3막","html":"정화가 지훈을 만난 날이면 도윤은 그 뒤의 시간을 자신에게 내달라고 한다. 어느 밤 \u003cb>정화는 지친 몸으로 쉬고 싶다고 말하려다 도윤의 불안한 얼굴을 보고 말을 삼킨다.\u003c/b> 자신이 도윤을 속였기 때문에 그가 불안해한다고 생각해서다. 정화가 그날도 도윤 곁에 남았다는 것을 안 지훈은 다시 두 번째가 되었다고 느낀다. 정화는 지훈에게도 시간을 더 내주며 두 사람을 달랜다.\u003cbr>화보 전시 개막 행사에서 지훈은 정화와 함께 작업한 사진작가로만 소개된다. 선배에게 작업을 빼앗겼을 때처럼 또 지워진다고 느낀 그가 연인으로 소개해 달라고 하자, 정화는 모두의 동의가 필요하다고 답한다. 정화와 지훈의 관계를 의심하는 글이 퍼지자, 제작진은 정화와 도윤에게 다른 연인을 만나지 않는다는 확인서에 서명하라고 요구한다. 도윤은 결혼 준비를 다시 알리면 의혹을 덮을 수 있다며 수습안을 내놓는다. 정화는 도윤을 사랑하지만 다른 연인이 없다고 \u003cb>거짓말할 수는 없다며 서명을 거절한다.\u003c/b> 관계를 지키려는 거짓말 대신 손해를 택한 정화는 처음으로 자신이 부끄럽지 않다고 느낀다. \u003cb>정화는 프로그램에서 하차하고, 위약금을 직접 정리한다.\u003c/b> 도윤은 정화가 방송을 잃으면서도 지훈을 포기하지 않자 상처받는다.\u003cbr>도윤은 남은 결혼 예약을 취소하면서도 결혼을 포기한 건 아니라고 말한다. 한편 하차한 정화에게는 다음 방송과 광고 제안이 들어오지 않지만, 두 남자는 각자의 일을 이어간다. 지훈이 언제까지 사진작가로만 소개되어야 하느냐고 묻자, 정화는 누가 물으면 사실대로 답하겠다고 약속하지만 도윤은 그 약속에 답하지 않는다. 다시 셋이 함께한 자리에서 도윤이 언젠가 자신에게 돌아올 것이냐고 묻자, 정화는 둘 다 사랑하며 \u003cb>어느 한 사람과 헤어지겠다고 약속할 수는 없다고 답한다.\u003c/b> 그날 밤 하지 못했던 대답이다. 그래도 누구도 떠나지 않고, 정화는 거짓말 없이도 두 사람이 곁에 남았다는 사실에 안도한다. 다음 만남을 정할 때 도윤과 지훈은 각자의 일정을 그대로 내놓고, \u003cb>일정을 바꾸는 사람은 정화뿐이다.\u003c/b> 정화는 혼자 쉬려던 날을 비워 셋의 약속을 맞추고, 두 사람 모두에게서 오겠다는 답을 받자 웃는다. 그러나 비워 버린 그날에 대해서는 누구에게도 말하지 않는다. 도윤은 돌아올 날을, 지훈은 연인으로 소개될 날을 기다리고, 정화는 그 기다림에 맞춰 자신의 날을 내어준다."}]},"chars":[{"id":"c_jh","name":"유정화","sub":"28세 · 인플루언서 겸 브랜드 모델","kw":"덤덤함, 연인 앞 장난기, 갈등 회피, 죄책감","colors":["#f8e6c4","#e67499"],"img":{"url":"images/096.jpg"},"traits":"평소에는 덤덤하고 조금 소심하지만 연인 앞에서는 장난을 치고 먼저 애정을 표현한다. 일에서는 자기 의견을 말하면서도, \u003cb>연인이 실망하거나 떠날까 봐 불만을 쉽게 말하지 못한다.\u003c/b> 서로의 외도를 모른 척하며 함께 사는 부모를 보고 자라, 문제가 있어도 말하지 않으면 헤어지지 않을 수 있다고 생각한다.","rel":"도윤과 함께하는 일상과 결혼을 원하면서도, 지훈과 작업하며 느끼는 즐거움과 그에 대한 사랑을 포기하지 못한다. 두 사람을 잃지 않으려고 각자가 듣고 싶어 하는 약속을 한다. 사실을 털어놓은 뒤에도 \u003cb>자신이 속였다는 죄책감 때문에 무리한 요구를 거절하지 못한다.\u003c/b>"},{"id":"c_dy","name":"서도윤","sub":"31세 · 브랜드 전략기획자","kw":"성실함, 다정함, 확고한 원칙, 기대","colors":["#454547","#829bdd"],"img":{"url":"images/097.jpg"},"traits":"성실하고 다정하지만 원칙이 확고하다. 방송에서 내세운 이미지가 거짓으로 드러나면 문제가 된다는 것을 알지만, 정화의 외도를 보고도 모른 척한다.","rel":"정화는 첫사랑이자 결혼을 약속한 연인이며, 실패한 이야기도 편하게 털어놓을 수 있는 사람이다. 결혼 준비를 중단하고 떠난 뒤에도 정화가 자신을 사랑한다는 사실 때문에 돌아온다. 지훈의 존재를 받아들이면서도 함께 지내다 보면 \u003cb>정화가 결국 자신만 선택할 것이라고 기대한다.\u003c/b> 결혼 준비를 끝낸 뒤에도 그 기대를 버리지 못한다."},{"id":"c_jhun","name":"한지훈","sub":"28세 · 프리랜서 사진작가","kw":"능청스러움, 가벼운 호감, 인정 욕구, 숨겨진 연인","colors":["#7a6d69","#b1b4ba"],"img":{"url":"images/098.jpg"},"traits":"능청스럽고 호감을 가볍게 드러낸다. 작업의 완성도와 자신의 기여를 인정받는 일을 중요하게 여기며, 과거 선배에게 작업 성과를 빼앗기고 촬영에서 제외된 적이 있다.","rel":"처음에는 자신의 인물 사진을 알아봐 준 정화에게 흥미를 느껴, 개인 촬영을 제안하며 가볍게 반응을 떠본다. 그러나 함께 작업하며 의견을 주고받고 정화가 작가 교체를 막아주자, \u003cb>가볍게 시작한 마음이 진심으로 바뀐다.\u003c/b> 결혼 전까지만 만나자는 말에 관계를 끝내려 하지만, 정화가 자신을 계속 연인으로 만나겠다고 하자 돌아온다. 관계를 당장 알리지 않기로 한 약속도 잠시 기다려 달라는 뜻으로 받아들인다. 사람들 앞에서 도윤만 연인으로 소개될 때마다 \u003cb>자신은 여전히 숨겨야 할 상대라고 느낀다.\u003c/b> 정화의 동의 없이 공개하지는 않지만, 계속 비밀로 남을 생각도 없다."}],"pinned":false,"cover":"images/101.jpg","stills":[]},{"id":"a8h9a3ju","title":"신부수업 중인데, 성격 좀 숨기겠습니다","intro":"누구보다 사랑스럽고 우아한 귀족 영애 세라핀. 원하는 사람과 결혼하려고 신부수업 수석을 노리지만, 화가 날 때마다 돌변하는 성격이 가장 큰 걸림돌이 된다.","genre":"로맨스 판타지 · 로맨틱 코미디 · 성장","category":"과제","episodes":[],"sheets":[],"docs":[],"cover":"images/102.jpg","pinned":false,"plan":{"meta":[],"title":"신부수업 중인데, 성격 좀 숨기겠습니다","rows":[{"label":"주제","html":"완벽하게 얌전한 사람이 되어야 사랑받는 것은 아니다. 자신의 장점과 결점을 인정하며 감정을 책임 있게 표현하고, \u003cb>사랑과 미래를 스스로 선택하는 성장 이야기.\u003c/b>"},{"label":"소재","html":"귀족 영애의 신부수업, 정략결혼, 성격 반전, 예법 교육, 아카데미 경쟁, 사교계 소동.\u003cbr>\u003cb>핵심 톤:\u003c/b> 우아한 로맨스 판타지 작화와 갑작스럽게 살벌해지는 표정·분위기의 대비를 이용한 캐릭터 코미디. 웃음을 중심에 두되 인물의 감정과 관계는 가볍게 소비하지 않는다."},{"label":"장르","html":"로맨스 판타지 / 로맨틱 코미디 / 성장 드라마"},{"label":"타깃층","html":"20~30대 여성 독자를 중심으로, 개성 강한 여성 주인공과 티격태격하는 로맨스, 일상 에피소드형 판타지 코미디를 선호하는 독자를 대상으로 한다. \u003cb>‘우아한 영애가 화가 나면 무서워진다’\u003c/b>는 즉각적인 반전으로 첫 화의 관심을 끌고, 인물 관계의 진전으로 연속 독서를 유도한다."},{"label":"인물","html":"\u003cb>세라핀 | 여주인공\u003c/b>\u003cbr>명문 귀족 가문의 영애. 예쁜 물건과 귀여운 동물을 좋아하고, 남에게 먼저 손을 내미는 진심으로 상냥한 인물이다. 다도와 사교 예절도 즐겁게 배우며 좋은 아내가 되고 싶어 한다. 다만 승부욕이 강하고 불합리하거나 무례한 말을 들으면 쉽게 발끈한다. 화가 치밀면 눈빛·표정·말투가 순식간에 험악해졌다가, 진정한 뒤에는 스스로 민망해하고 사과하기도 한다. 두 개의 인격을 가진 것이 아니라 \u003cb>다정함과 다혈질이 공존하는 한 사람\u003c/b>이다. 가문이 정한 정략결혼 대신 자신이 사랑하는 사람을 선택하기 위해 황실 신부 아카데미의 수석 졸업을 노린다.\u003cbr>\u003cbr>\u003cb>카일 | 남주인공\u003c/b>\u003cbr>황실에서 신부 아카데미로 파견한 감찰관. 규칙과 책임을 중시하며 쉽게 동요하지 않는다. 세라핀의 상냥한 모습을 높게 평가하다가 그녀가 화내는 현장을 목격하고 당황한다. 처음에는 사고를 막으려고 그녀를 주시하지만, 남을 돕는 진심과 자신의 실수를 인정하는 태도를 보며 호감이 생긴다. 세라핀의 성격을 ‘고쳐 주는’ 인물이 아니라, 그녀가 감정을 다루는 과정을 존중하면서 \u003cb>자신의 경직된 기준도 돌아보는 인물\u003c/b>이다. 직접적인 수업 성적 평가에는 관여하지 않는다.\u003cbr>\u003cbr>\u003cb>리안 | 라이벌이자 친구\u003c/b>\u003cbr>신부 아카데미의 수석 후보. 규범과 품위를 중시하고 실력을 꾸준히 쌓아 온 모범생이다. 감정을 겉으로 드러내는 세라핀을 이해하지 못해 자주 충돌한다. 그러나 자신 역시 타인의 기대에 맞추느라 고집을 숨겨 왔다는 점이 드러나고, 사건을 함께 해결하면서 세라핀과 경쟁하면서도 서로 돕는 사이로 변한다."},{"label":"배경","html":"유럽풍 가상 제국. 귀족 사회에서는 결혼 전 예법·사교·가정 관리 교육을 중시한다. 황실 신부 아카데미는 명문가의 영애들이 모여 다도, 자수, 꽃꽂이, 무도회 예법, 사교술, 가정 관리 등을 배우는 교육기관이다.\u003cbr>\u003cbr>학생들은 실기 성적과 품행을 함께 평가받는다. \u003cb>아카데미의 수석 졸업생에게는 황실이 보증하는 혼인 선택권이 주어지므로\u003c/b>, 가문이 혼인을 강행하려 해도 스스로 배우자를 선택할 수 있다. 세라핀에게 아카데미는 억압적인 장소이기만 한 것이 아니라, 실제로 배우고 성장하며 자유를 얻을 기회다."},{"label":"1화 구성","html":"\u003cb>도입\u003c/b> 사교계에서 ‘완벽한 귀족 영애’로 칭찬받는 세라핀의 화사하고 상냥한 모습. 독자는 그녀가 전형적인 우아한 여주인공이라고 생각한다.\u003cbr>\u003cb>발단\u003c/b> 가문이 일방적으로 정략결혼을 통보한다. 세라핀은 정중하게 거절하지만 이야기가 통하지 않자 표정이 일순간 험악해진다. 자신이 결혼을 선택할 방법으로 황실 신부 아카데미를 택한다.\u003cbr>\u003cb>전개\u003c/b> 입학 첫 수업에서 뛰어난 실력을 보이는 세라핀. 그녀는 진심으로 수업을 즐기고 동기들을 친절하게 대한다.\u003cbr>\u003cb>반전\u003c/b> 한 학생이 정략결혼 이야기를 꺼내며 선을 넘는 말을 한다. 세라핀은 웃으며 넘기려 하지만 손에 든 부채가 ‘우드득’ 부러진다. 그 순간 화면 위로 공포스럽게 붉은 그림자가 치솟고, 아래에는 태연히 웃는 세라핀이 대비된다.\u003cbr>\u003cb>엔딩\u003c/b> 감찰관 카일이 망가진 부채와 세라핀의 미소를 번갈아 본다. “세라핀 영애, 방금 무슨 일이 있었습니까?” 세라핀은 눈을 깜빡이다 답한다. “어머, 아무 일도 없었답니다.” 속마음: ‘아아아, 하필 지금!’"},{"label":"핵심 매력","html":"\u003cb>성격 반전\u003c/b> 평소의 다정함도 분노한 모습도 진짜인 여주인공. 예쁜 작화가 갑자기 공포스럽고 과장된 감정 연출로 변하는 시각적 반전이 핵심 웃음 포인트다.\u003cbr>\u003cb>에피소드 확장성\u003c/b> 다도, 자수, 사교술, 무도회, 가정 관리 등 수업별 과제를 중심으로 각기 다른 실패·성공·인물 관계를 설계할 수 있다. ‘또 화내고 또 물건을 부순다’는 반복은 피한다.\u003cbr>\u003cb>로맨스\u003c/b> 감찰관과 문제 학생이라는 첫인상에서 출발해, 장점뿐 아니라 결점도 알고 사랑하게 되는 관계. 상대를 통제하거나 교정하는 사랑이 아니라 서로의 변화를 지지하는 방향이다.\u003cbr>\u003cb>성장\u003c/b> 완벽한 숙녀가 되는 것이 아니라, 자신의 감정을 선택하고 책임질 줄 아는 사람이 되는 과정이다."},{"label":"기획 시 유의점","html":"세라핀의 화는 폭력성을 미화하기 위한 장치가 아니라 반전 개그의 출발점이다. 실제로 남에게 피해를 주었을 때는 사과와 수습이 뒤따라야 호감이 유지된다. 정략결혼 상대가 왜 싫은지, 카일과 서로 좋아지게 되는 결정적 사건이 무엇인지는 다음 개발 단계에서 구체화할 필요가 있다."}],"synTitle":"시놉시스","syn":[{"label":"1막","html":"\u003cb>완벽한 영애의 험난한 입학\u003c/b>\u003cbr>아름답고 상냥한 귀족 영애 세라핀은 사랑하는 사람과 행복한 가정을 꾸리는 것이 꿈이다. 하지만 부모가 자신의 의사를 묻지 않고 정략결혼을 추진하자 반발한다. 세라핀은 수석 졸업생에게 혼인 선택권을 주는 황실 신부 아카데미에 입학해 직접 미래를 결정하기로 한다.\u003cbr>\u003cbr>실력도 좋고 태도도 다정한 세라핀은 첫 수업부터 기대를 모은다. 그러나 다른 학생의 무례한 발언을 듣자 자신도 모르게 살벌한 표정으로 돌변하고, 손에 쥔 부채를 부러뜨린다. 소동을 목격한 감찰관 카일은 그녀를 주시하기 시작한다. 세라핀은 입학하자마자 품행 평가가 깎일 위기에 놓인다."},{"label":"2막","html":"\u003cb>신부수업은 오늘도 평화롭지 않다\u003c/b>\u003cbr>세라핀은 수석 자리를 지키기 위해 더 열심히 수업에 참여한다. 다도에서는 실수한 친구를 따뜻하게 격려하지만, 자신을 비웃는 영애 앞에서는 웃는 얼굴로 독설을 내뱉는다. 자수 시간에는 바늘땀이 꼬여 혼자 속을 끓이고, 무도회에서는 무례한 파트너의 발을 힘껏 밟을 뻔한다. 매번 사고가 날 듯 말 듯한 상황이 이어지지만, 세라핀은 점차 분노를 다른 방식으로 풀어 보려 애쓴다.\u003cbr>\u003cbr>카일은 세라핀의 돌발 행동을 경계하면서도 그녀가 곤란한 학생을 돕고 잘못한 일은 책임지는 모습을 보며 선입견을 수정한다. 세라핀 역시 엄격하기만 한 줄 알았던 카일이 남의 체면을 지켜 주는 데 세심하다는 것을 알게 된다. 두 사람은 티격태격하는 사이에서 서로의 약점을 편하게 드러낼 수 있는 관계로 가까워진다.\u003cbr>\u003cbr>라이벌 리안과의 경쟁도 격해진다. 그러나 리안이 집안의 기대 때문에 수석에 집착하고 있음을 알게 된 세라핀은 그녀를 무조건 미워할 수 없어진다. 함께 중요한 행사를 수습한 뒤 둘은 경쟁을 이어 가면서도 서로의 실력을 인정한다. 이때 세라핀의 가문은 졸업 전 정략결혼을 확정하려 움직이고, 세라핀은 수석에 오르지 못하면 선택권을 잃을 수 있다는 압박을 받는다."},{"label":"3막","html":"\u003cb>완벽하지 않아도 내 결혼은 내가 정한다\u003c/b>\u003cbr>졸업 심사를 앞두고 세라핀은 높은 실기 성적에도 불구하고 과거의 소동으로 품행 평가가 불리해진다. 부모는 아카데미를 포기하고 정략결혼을 받아들이라고 종용한다. 세라핀은 좋아하는 사람에게도 자신의 다혈질적인 모습을 보이는 것이 부끄러워 한동안 움츠러든다.\u003cbr>\u003cbr>카일과 리안은 세라핀이 단지 화를 잘 내는 사람이 아니라 곁의 사람들을 진심으로 아끼는 인물임을 상기시켜 준다. 세라핀은 감정을 없애려 하기보다 이유를 말하고, 잘못은 바로 인정하며, 필요한 순간에는 침착하게 반박하는 법을 배운다. 최종 심사에서 예상치 못한 돌발 상황이 벌어지자 그녀는 흥분을 가라앉히고 배운 지식과 사람들을 배려하는 태도로 문제를 해결한다.\u003cbr>\u003cbr>세라핀은 수석으로 졸업해 혼인 선택권을 얻고, 가문이 추진한 정략결혼을 거절한다. 카일과도 서로의 마음을 확인하지만, 연애를 시작했다고 성격이 완전히 달라지는 것은 아니다. 세라핀이 또 발끈하자 카일은 웃으며 말한다. “오늘도 참 우아하시군요.” 세라핀은 눈을 가늘게 뜬다. “지금 저 놀리시는 거예요?”"}]},"chars":[{"id":"c_seraphine","name":"세라핀","sub":"여주인공 · 명문 귀족 가문의 영애","kw":"상냥함, 승부욕, 다혈질, 성격 반전","colors":["#8a5a4a","#b8323a"],"img":{"url":"images/099.jpg"},"traits":"예쁜 물건과 귀여운 동물을 좋아하고, 남에게 먼저 손을 내미는 진심으로 상냥한 인물이다. 다도와 사교 예절도 즐겁게 배우며 좋은 아내가 되고 싶어 한다. 다만 승부욕이 강하고 불합리하거나 무례한 말을 들으면 쉽게 발끈한다. 화가 치밀면 눈빛·표정·말투가 순식간에 험악해졌다가, 진정한 뒤에는 스스로 민망해하고 사과하기도 한다. 두 개의 인격을 가진 것이 아니라 \u003cb>다정함과 다혈질이 공존하는 한 사람\u003c/b>이다.","rel":"가문이 정한 정략결혼 대신 자신이 사랑하는 사람을 선택하기 위해 \u003cb>황실 신부 아카데미의 수석 졸업\u003c/b>을 노린다. 감찰관 카일에게는 입학 첫날부터 화내는 현장을 들켜 주시 대상이 되고, 수석 후보 리안과는 자주 충돌하지만 점차 경쟁하면서도 서로 돕는 사이가 된다."}],"stills":[{"url":"images/100.jpg","w":1500,"h":2505}]}],"bio":"","profile":{"history":[{"p":"2026","t":"세종대학교 만화애니메이션텍 재학"}],"name":"-","aff":"세종대학교 만화애니메이션텍","fields":"웹툰 기획, 글콘티, 콘티","tools":"클립 스튜디오, 포토샵, 일러스트레이터","email":"02sohui@gmail.com","links":""},"siteUrl":"https://lgy-10.github.io/lgy-portfolio","footer":"","tagline":""}</script>

<style>
/* Layout: 목록(작품 정보 + 회차 줄) ↔ 뷰어(가운데 세로 스트립, 위·아래 막대는 탭하면 숨김) */
:root{
  --bg:#f5f5f6; --surface:#ffffff; --ink:#151517; --muted:#6e6e76; --line:#e4e4e8;
  --accent:#3d3e44; --accent-ink:#ffffff; --plab:#dcdcdf; --pline:#9a9aa0; --phead:#2a2b30; --phead-ink:#f4f4f6; --hl:#dcdce2; --good:#1f8a55; --bad:#d23f3f; --view:#141416; --view-bar:rgba(20,20,22,.94); --view-ink:#f1f1f3;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111113;--surface:#1b1b1e;--ink:#ececf0;--muted:#9a9aa3;--line:#2c2c31;--accent:#d9d9de;--accent-ink:#151517;--plab:#2c2c31;--pline:#4a4a52;--phead:#26262b;--phead-ink:#ececf0;--hl:#3a3a42;--good:#25995f;--bad:#d9534f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--surface:#1b1b1e;--ink:#ececf0;--muted:#9a9aa3;--line:#2c2c31;--accent:#d9d9de;--accent-ink:#151517;--plab:#2c2c31;--pline:#4a4a52;--phead:#26262b;--phead-ink:#ececf0;--hl:#3a3a42;--good:#25995f;--bad:#d9534f;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* 목록 */
.list{max-width:720px;margin:0 auto;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding-block:22px 18px;align-items:end}
.cover{width:120px;aspect-ratio:3/4;border-radius:8px;background:var(--line) center/cover no-repeat;max-width:100%}
.hero h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.hero .meta{color:var(--muted);font-size:13px;margin-top:4px}
.hero .intro{margin-top:8px;font-size:13.5px;color:var(--ink);white-space:pre-line}
.hero input,.hero textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px}
.hero textarea{min-height:60px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.sorter{margin-left:auto}
.eps{display:flex;flex-direction:column}
.ep{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ep .th{width:96px;height:56px;border-radius:4px;background:var(--line) center top/cover no-repeat}
.ep b{font-weight:700;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep span{color:var(--muted);font-size:12.5px}
.ep .tools{display:flex;gap:2px}
.ep .tools button{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:6px;font-size:13px}
.ep .tools button:hover{background:var(--line);color:var(--ink)}
.libhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:22px 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.libhead h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.08em}
.libhead input{font-size:20px;font-weight:900;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 8px;min-width:0;flex:1}
.bio{margin:-6px 0 12px;color:var(--muted);font-size:14px;white-space:pre-line}
.bio:empty{display:none}

<script>
(function(){
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const OFF=!!window.__CV_OFFLINE__;
const LS={get(k){try{return localStorage.getItem('cv-'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('cv-'+k,v)}catch(e){}}};
let D={title:'PORTFOLIO',works:[]}, catFilter='', kind='episodes', downloadsApi=null, artifactApi=null, assetsApi=null, canEdit=false, libEditing=false, editing=false, desc=false, W=null, cur=null, draft=null;

function toast(t,type){const el=$('#toast');el.textContent=t;
  if(!type)type=/못|없어요|실패|권한|너무 커|주세요\./.test(t)?'bad':/했어요|바꿨어요|쓸게요|만들었어요|정했어요|풀었어요|올렸어요/.test(t)?'ok':'';
  el.classList.toggle('ok',type==='ok');el.classList.toggle('bad',type==='bad');el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2400)}
function fmt(d){try{return new Date(d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'})}catch(e){return ''}}
function armDelete(btn,fn,label2){const l=btn.textContent;btn.onclick=e=>{e.preventDefault();e.stopPropagation();if(btn.classList.contains('arm')){btn.classList.remove('arm');btn.textContent=l;fn();return}btn.classList.add('arm');btn.textContent=label2||'한 번 더 누르면 삭제';setTimeout(()=>{btn.classList.remove('arm');btn.textContent=l},2500)}}
function migrate(d){if(d&&!d.works&&d.episodes){return {title:'PORTFOLIO',works:[{id:uid(),title:d.title||'작품',intro:d.intro||'',genre:'',episodes:d.episodes}]}}d=d||{};d.works=d.works||[];d.works.forEach(w=>{w.episodes=w.episodes||[];w.sheets=w.sheets||[];w.docs=w.docs||[];w.stills=w.stills||[]});return d}
const KINDS={episodes:{name:'회차',one:'화',add:'+ 새 화 추가',newT:n=>n+'화',drop:'콘티 이미지(여러 장) 또는 PDF를 여기에 끌어다 놓거나',ph:'예: 2화 · 촬영장'},sheets:{name:'캐릭터 시트',one:'시트',add:'+ 캐릭터 시트 추가',newT:n=>'캐릭터 '+n,drop:'캐릭터 시트 이미지(여러 장) 또는 PDF를 끌어다 놓거나',ph:'예: 유정화'},docs:{name:'기획안',one:'문서',add:'+ 기획안 추가',newT:n=>'기획안 '+n,drop:'기획안 PDF 또는 이미지를 끌어다 놓거나',ph:'예: 기획안 v3'}};
function allItems(w){return [...w.episodes,...w.sheets,...w.docs]}
function coverOf(w){if(w.cover)return w.cover;const e=w.episodes[0]||w.sheets[0]||w.docs[0];return e&&e.pages[0]?e.pages[0].url:''}
function lastDate(w){return Math.max(0,...allItems(w).map(e=>Date.parse(e.date)||0))}

// ---- 편의 기능 ----
function copyText(t){const done=()=>toast('링크를 복사했어요');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();ok?done():toast('복사하지 못했어요. 주소창에서 복사해 주세요.')}}
function linkFor(hash){const base=(D.siteUrl||'').trim().replace(/\/+$/,'');const onWeb=/^https?:$/.test(location.protocol)&&!/claude|anthropic/i.test(location.host);if(onWeb)return location.origin+location.pathname+hash;if(base&&/^https?:\/\//.test(base))return base+'/'+hash;return location.href.split('#')[0]+hash}
let undoT=null,undoFn=null,undoLater=null;
function offerUndo(label,restore,later){if(undoLater){const f=undoLater;undoLater=null;f()}clearTimeout(undoT);undoFn=restore;undoLater=later||null;$('#undoTxt').textContent=label;$('#undoBar').hidden=false;
  undoT=setTimeout(()=>{$('#undoBar').hidden=true;undoFn=null;if(undoLater){const f=undoLater;undoLater=null;f()}},7000)}
let sortLib=null;async function withSortable(){if(window.Sortable)return window.Sortable;if(!sortLib)sortLib=loadScript('https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js').catch(()=>null);await sortLib;return window.Sortable||null}
let realEdit=false;
function setVisit(on){if(on){realEdit=canEdit;canEdit=false;$('#visitBar').hidden=false}else{canEdit=realEdit;$('#visitBar').hidden=true}renderAll()}
async function persist(){
  if(!artifactApi){toast('이 화면에서는 저장할 수 없어요.');return false}
  try{await artifactApi.publish({'data.json':{content:JSON.stringify(D),contentType:'application/json'}});return true}
  catch(e){const c=e&&e.code;if(c==='conflict')toast('다른 곳에서 먼저 저장해서 새 내용으로 다시 열려요.');else if(c==='not_writer'||c==='not_granted'){canEdit=false;renderAll();toast('편집 권한이 없어요.')}else toast('저장하지 못했어요. 잠시 뒤 다시 해 주세요.');return false}
}

// ---------- 서재 ----------
function renderLib(){
  const head=$('#libTitle');
  if(head.tagName==='INPUT'){const h=document.createElement('h1');h.id='libTitle';head.replaceWith(h)}
  if(!libEditing){const ht=$('#libTitle');const tt=D.title||'PORTFOLIO';if(ht.dataset.t!==tt){ht.dataset.t=tt;ht.innerHTML='';ht.setAttribute('aria-label',tt);[...tt].forEach((ch,k)=>{const sp=document.createElement('span');sp.className='lt';sp.setAttribute('aria-hidden','true');sp.style.setProperty('--k',k);sp.textContent=ch===' '?'\u00a0':ch;ht.appendChild(sp)})}}
  renderProf();renderFeat();renderFoot(true);{const tg=$('#tagline');const v=(D.tagline||'').trim();tg.textContent=v;tg.hidden=!v}
  $('#exportOff').hidden=!(canEdit&&!OFF);$('#exportZip').hidden=!(canEdit&&!OFF);
  const cats=[...new Set(D.works.map(w=>w.category).filter(Boolean))];
  if(catFilter&&!cats.includes(catFilter))catFilter='';
  const cb=$('#chips');cb.innerHTML='';
  if(cats.length){['',...cats].forEach(c=>{const b=document.createElement('button');b.className='chip'+(catFilter===c?' on':'');b.textContent=c||'전체';b.setAttribute('aria-pressed',catFilter===c);b.onclick=()=>{catFilter=c;renderLib();const g=$('#works');g.classList.remove('tabswap');void g.offsetWidth;g.classList.add('tabswap');setTimeout(()=>g.classList.remove('tabswap'),900)};cb.appendChild(b)})}
  $('#libEdit').hidden=!canEdit;$('#profEdit').hidden=!canEdit;$('#visitBtn').hidden=!canEdit;
  const box=$('#works');box.innerHTML='';
  const base=orderedWorks();const ws=base.filter(w=>!catFilter||w.category===catFilter).sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||(base.indexOf(a)-base.indexOf(b)));
  ws.forEach(w=>{
    const a=document.createElement('a');a.className='work';a.href='#w-'+w.id;a.style.setProperty('--i',3+box.children.length);
    const cv=document.createElement('div');cv.className='cv';const c=coverOf(w);if(c)cv.style.backgroundImage='url("'+c+'")';
    const b=document.createElement('b');b.textContent=w.title||'제목 없음';
    const s=document.createElement('span');const cuts=w.episodes.reduce((t,e)=>t+(e.cuts||0),0);s.textContent=[w.category,w.genre,w.episodes.length?w.episodes.length+'화'+(cuts?' '+cuts+'컷':''):''].filter(Boolean).join(' · ');
    if(canEdit){const pb=document.createElement('button');pb.className='pinb'+(w.pinned?' on':'');pb.textContent=w.pinned?'★ 대표작':'☆ 고정';pb.setAttribute('aria-pressed',!!w.pinned);pb.setAttribute('aria-label',(w.title||'작품')+(w.pinned?' 대표작 고정 해제':' 대표작으로 고정'));
      pb.onclick=async ev=>{ev.preventDefault();ev.stopPropagation();w.pinned=!w.pinned;renderLib();if(await persist())toast(w.pinned?'대표작으로 고정했어요':'대표작 고정을 풀었어요')};cv.appendChild(pb)}
    if(w.pinned){const pn=document.createElement('span');pn.className='pin';pn.textContent='대표작';a.append(cv,pn,b,s)}else a.append(cv,b,s);box.appendChild(a);
  });
  if(canEdit){
    const add=document.createElement('button');add.className='work add';add.style.border='0';add.style.background='transparent';add.style.padding='0';add.style.textAlign='left';
    add.innerHTML='<div class="cv">+</div><b>새 작품</b><span>콘티를 올릴 작품 만들기</span>';
    add.onclick=async()=>{const w={id:uid(),title:'새 작품',intro:'',genre:'',category:catFilter||'',episodes:[],sheets:[],docs:[]};D.works.push(w);if(await persist()){location.hash='w-'+w.id;setTimeout(()=>{openManage('info');$('#titleIn').focus();$('#titleIn').select()},80)}};
    box.appendChild(add);
  }
  if(!D.works.length&&!canEdit)box.innerHTML='<div class="empty">아직 올라온 작품이 없어요.</div>';
}
let lmMode='';
function openLibMng(mode){if(!canEdit)return;lmMode=mode;$('#libMng').hidden=false;document.body.style.overflow='hidden';renderLibMng();$('#libMng').scrollTop=0}
async function closeLibMng(){if(lmMode==='profile')await saveProfile(true);lmMode='';$('#libMng').hidden=true;document.body.style.overflow='';renderLib()}
$('#lmClose').onclick=()=>closeLibMng();
$('#lmSave').onclick=()=>saveProfile(false);
$('#libEdit').onclick=()=>openLibMng('works');

async function squareAvatar(file){const url=URL.createObjectURL(file);const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const m=Math.min(img.naturalWidth,img.naturalHeight),S=Math.min(480,m);const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);
  x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(url);return new Promise(r=>c.toBlob(r,'image/jpeg',0.9))}

  const sync=()=>{const sel=[...chips.querySelectorAll('button[aria-pressed="true"]')].map(b=>b.dataset.t);const ex=other.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);inp.value=[...sel,...ex].join(', ')};

  other.oninput=sync;

}

let MAXH=1600;const TW=900;
function canvasToBlob(c){return new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}
async function sliceCanvas(w,h,draw){
  const out=[];let y=0;
  while(y<h){let sh=Math.min(MAXH,h-y);if(h-(y+sh)<300)sh=h-y;
    const c=document.createElement('canvas');c.width=w;c.height=sh;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,sh);draw(ctx,y,sh);
    out.push({blob:await canvasToBlob(c),w,h:sh});y+=sh}
  return out;
}

async function makeOgImage(){const w=D.works.find(x=>x.pinned)||orderedWorks()[0];const c=w&&coverOf(w);
  const cv=document.createElement('canvas');cv.width=1200;cv.height=630;const x=cv.getContext('2d');const g=x.createRadialGradient(600,280,80,600,315,760);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#e9e5e8');x.fillStyle=g;x.fillRect(0,0,1200,630);
  if(c){try{const im=await new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=c});const h=560,wd=im.naturalWidth*h/im.naturalHeight;x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=30;x.shadowOffsetY=10;x.drawImage(im,(1200-wd)/2,35,wd,h)}catch(e){}}
  else{x.fillStyle='#2a2b30';x.font='900 84px "Noto Sans KR",sans-serif';x.textAlign='center';x.fillText(D.title||'PORTFOLIO',600,340)}
  return new Promise(r=>cv.toBlob(r,'image/jpeg',0.88))}
let zipBusy=false;
async function exportZip(){
  if(zipBusy)return;if(!downloadsApi){toast('이 화면에서는 파일로 내려받을 수 없어요.');return}
  zipBusy=true;const btn=$('#exportZip');const lbl=btn.textContent;btn.disabled=true;
  try{
    if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    let src=null;try{const r=await fetch('index.html',{cache:'no-store'});if(r.ok)src=await r.text()}catch(e){}
    if(!src||!window.JSZip){toast('사이트 파일을 만들지 못했어요.');return}
    if(!/^\s*<!doctype/i.test(src))src='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+(D.title||'Portfolio').replace(/</g,'')+'</title><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+src+'</body></html>';
    const zip=new JSZip();const img=zip.folder('images');
    const copy=JSON.parse(JSON.stringify(D));const all=[];
    if(copy.profile&&copy.profile.avatar&&copy.profile.avatar.url)all.push(copy.profile.avatar);copy.works.forEach(w=>{allItems(w).forEach(e=>e.pages.forEach(p=>all.push(p)));(w.chars||[]).forEach(c=>{if(c.img&&c.img.url)all.push(c.img)});(w.stills||[]).forEach(p=>all.push(p))});
    const map={};let n=0;
    const grab=async url=>{if(map[url]!==undefined)return map[url];try{const r=await fetch(url);const b=await r.blob();const ext=/png/.test(b.type)?'png':/webp/.test(b.type)?'webp':'jpg';const name='images/'+String(++n).padStart(3,'0')+'.'+ext;img.file(name.slice(7),b);map[url]=name}catch(e){map[url]=''}return map[url]};
    for(let k=0;k<all.length;k++){btn.textContent='이미지 '+(k+1)+'/'+all.length;all[k].url=await grab(all[k].url);delete all[k].id}
    for(const w of copy.works){if(w.cover)w.cover=await grab(w.cover);delete w.coverId}
    const S='<scr'+'ipt',E2='</scr'+'ipt>';
    const inj=S+'>window.__CV_OFFLINE__=true'+E2+S+' id="cv-'+'data" type="application/json">'+JSON.stringify(copy).replace(/</g,'\\u003c')+E2;
    const k=src.search(/<body[^>]*>/i);const end=src.indexOf('>',k)+1;
    let og=null;try{og=await makeOgImage()}catch(e){}if(og)img.file('og.jpg',og);
    zip.file('index.html',injectHead(src.slice(0,end)+inj+src.slice(end),metaTags(og?'images/og.jpg':'')));
    zip.file('읽어 주세요.txt','이 폴더를 통째로 웹 호스팅(Netlify Drop, GitHub Pages 등)에 올리면 사이트가 돼요.\nindex.html을 더블클릭해서 바로 볼 수도 있어요.\nimages 폴더와 index.html은 항상 같은 위치에 두어야 해요.\n수정은 Claude의 원래 페이지에서 하고, 바뀌면 이 파일을 다시 받아 주세요.\n');
    btn.textContent='압축 중…';
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    await downloadsApi.save({filename:(D.title||'portfolio').replace(/[\\/:*?"<>|]/g,'')+'_site.zip',data:blob});toast('사이트 파일을 만들었어요');
  }catch(e){if(!(e&&e.code==='declined'))toast(e&&e.code==='too_large'?'파일이 너무 커서 받을 수 없어요.':'사이트 파일을 저장하지 못했어요.')}
  finally{zipBusy=false;btn.disabled=false;btn.textContent=lbl}
}
$('#exportZip').onclick=exportZip;
(function caps(n){
  if(OFF)return;
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(d=>{downloadsApi=d});
    window.claude.use('artifact').then(a=>{artifactApi=a;canEdit=!!a;renderAll()});
    window.claude.use('assets').then(s=>{assetsApi=s});
  }else if(n<40)setTimeout(()=>caps(n+1),250);
})(0);
})();
